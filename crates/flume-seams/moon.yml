$schema: 'https://moonrepo.dev/schemas/project.json'

# The seams: the seven traits of Part B, the types they pass, and git's
# history and the host beside them. Each check is one task, in the fast
# layer.
language: 'rust'
layer: 'library'
dependsOn: []

tasks:
  format:
    command: 'cargo fmt --check -p flume-seams'
    inputs: ['/crates/flume-seams/**/*', '/Cargo.toml', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p flume-seams --all-targets -- -D warnings'
    inputs: ['/crates/flume-seams/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p flume-seams'
    inputs: ['/crates/flume-seams/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
