# flume's own change@4, one version of one kind, built into the binary and read
# through weir-kinds like any other declaration (22, 157, C.2; design 7;
# records 0054, 0064). It is change@3 at the next version, each stage's
# agent given `full` in the kind's layer, the last of 32's, and each prompt
# saying that stopping short is its agent's one way to ask (28, 162; record
# 0064). Each prompt is a path beside this file, in this version's own
# directory. A kind a repository or a launch declares by the same name
# stands over flume's own (19).

[kinds.change]
version = 4
branch = "change"
starts_unready = false
lands = true

[[kinds.change.stages]]
name = "construct"
prompt = "prompts/change-construct.md"
deliverables = ["change"]
agents = [{ mode = "full" }]

[[kinds.change.stages]]
name = "code"
prompt = "prompts/change-code.md"
deliverables = ["tasks"]
agents = [{ mode = "full" }]
# One agent for the whole change, each task checked by its own check
# alone, and no repeat (22, S119; record 0054).

[[kinds.change.stages]]
name = "verify"
prompt = "prompts/change-verify.md"
deliverables = ["archived"]
agents = [{ mode = "full" }]
on_fail = "code"
