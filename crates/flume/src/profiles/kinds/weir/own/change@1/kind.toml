# flume's own change@1, one version of one kind, built into the binary and read
# through weir-kinds like any other declaration (22, 157, C.2; design 7).
# Each prompt is a path beside this file, in this version's own
# directory. A kind a repository or a launch declares by the same name
# stands over flume's own (19).

[kinds.change]
version = 1
branch = "change"
starts_unready = false
lands = true

[[kinds.change.stages]]
name = "construct"
prompt = "prompts/change-construct.md"
deliverables = ["change"]
agents = [{}]

[[kinds.change.stages]]
name = "code"
prompt = "prompts/change-code.md"
deliverables = ["tasks"]
agents = [{}]

[[kinds.change.stages]]
name = "verify"
prompt = "prompts/change-verify.md"
deliverables = ["archived"]
agents = [{}]
on_fail = "code"
