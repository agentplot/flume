$schema: 'https://moonrepo.dev/schemas/project.json'

# The binary: the core built over the profiles built in, each answer
# written as JSON. Its tests run each seam's scenarios against its
# profile on scratch repositories, the pinned openspec among the tools
# they read. Each check is one task, in the fast layer, but `tools`: the
# profiles against the pinned herdr, on servers the tests start, in the
# check-tools layer.
language: 'rust'
layer: 'application'
dependsOn: [seams, core, fakes, conformance]

tasks:
  format:
    command: 'cargo fmt --check -p flume'
    inputs: ['/crates/flume/**/*', '/Cargo.toml', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p flume --all-targets --all-features -- -D warnings'
    inputs: ['/crates/flume/**/*', '/crates/flume-seams/**/*', '/crates/flume-core/**/*', '/crates/flume-fakes/**/*', '/crates/flume-conformance/**/*', '/.config/flume.toml', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p flume'
    inputs: ['/crates/flume/**/*', '/crates/flume-seams/**/*', '/crates/flume-core/**/*', '/crates/flume-fakes/**/*', '/crates/flume-conformance/**/*', '/.config/flume.toml', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  tools:
    command: 'cargo test -p flume --features tools --test tools'
    inputs: ['/crates/flume/**/*', '/crates/flume-seams/**/*', '/crates/flume-core/**/*', '/crates/flume-fakes/**/*', '/crates/flume-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-tools]
    options: {runFromWorkspaceRoot: true}
