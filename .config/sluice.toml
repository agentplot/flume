# sluice gates every merge onto main and into a bolt (kit:gate.1): the
# checks moon tags, in flume's devenv shell (kit:gate.2), main and the
# bolts on GitHub as the sluice app lands them (kit:gate.4). crew makes
# each bolt there with `sluice branch create`. The layers are
# .moon/workspace.yml's: check-live, run by hand in the devenv shell with
# a test account's Claude Code token, is required by no branch.
[tests]
runner = "moon"
toolchain = ["devenv", "print-dev-env"]
# A check that finds the host lacking what it needs of it, a socket's path
# with no room among them, exits 77 and says why: no outcome, run again
# (record 0047, core.51).
not_run = [77]

[executor]
kind = "sandbox"
# The profiles' tests listen on localhost; nothing reaches further.
network = "localhost"

[branches."bolt/*"]
required = ["#check-fast"]
# A replay counts when a run this gate trusts recorded a pass for its key.
trust = ["open", "sandbox", "container"]
parallel = 4
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

# A replay counts on main only when a sandboxed or confined run recorded a
# pass for its key: the cache also holds what open shells ran.
[branches.main]
required = ["#check-fast", "#check-tools"]
trust = ["confined", "sandbox"]
parallel = 2
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

[branches.main.pull_requests]
reviews = 0
