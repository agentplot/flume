$schema: 'https://moonrepo.dev/schemas/project.json'

# The site: its prose, checked by Vale, and its build. Both are in the fast
# layer. The Pages workflow builds and publishes it on every push to main.
language: 'typescript'
layer: 'application'

tasks:
  prose:
    command: 'vale src/content/docs'
    inputs: ['src/content/docs/**/*', '/.vale.ini', '/styles/**/*', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
  # astro's bin starts `#!/usr/bin/env node`, and the devenv holds no node:
  # `bun run` would stand in a `node` of bun's own written under /tmp, which
  # the gate's sandbox does not let it write, so bun runs astro's bin itself.
  # astro keeps its telemetry setting in the user's home, which a gate's
  # sandbox may not let it write: with telemetry off it reads nothing there.
  build:
    command: 'bun ./node_modules/astro/bin/astro.mjs build'
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    inputs: ['src/**/*', 'public/**/*', 'astro.config.mjs', 'package.json', 'bun.lock', 'tsconfig.json', '/devenv.nix', '/devenv.lock', '/.prototools']
    outputs: ['dist']
    deps: ['~:install']
    tags: [check-fast]
  # No layer: it checks nothing, and build, which the gate runs, runs it
  # first.
  install:
    command: 'bun install --frozen-lockfile'
    inputs: ['package.json', 'bun.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    options: {cache: false}
