$schema: 'https://moonrepo.dev/schemas/project.json'

# flume's Claude Code plugin (design 17): its manifests, its hooks, the
# /launch command, its MCP server's entry, and its one hooks module, which
# pins the place's line under the prompt and holds the deliver part
# (hooks/flume.ts). The command hooks are the
# binary's `flume hook <event>`; the module is TypeScript, typed against
# the engine types the pinned Claude Code writes (engine-types/,
# tsconfig.json) and tested by the pinned engine. Every check runs the
# Claude Code and TypeScript devenv.nix pins, and no toolchain of moon's,
# which would fetch one inside the sandbox. Each check is one task, in
# the fast layer (core.21).
language: 'typescript'
layer: 'application'

tasks:
  # The plugin's files, by every formatter treefmt.nix configures: Biome
  # formats and lints the module, its tests and the JSON.
  format:
    command: 'treefmt --ci plugins/claude'
    inputs: ['/plugins/claude/**/*', '/treefmt.nix', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The manifest, the hooks, the module and the command, by the pinned
  # Claude Code's strict validation, which fails a warning as an error.
  validate:
    command: '../claude.sh plugin validate --strict .'
    inputs: ['.claude-plugin/**/*', 'hooks/**/*', 'commands/**/*', '.mcp.json', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # The engine types are the ones the pinned Claude Code writes, byte for
  # byte (tests/engine-types.sh).
  engine-types:
    command: 'bash tests/engine-types.sh'
    inputs: ['engine-types/**/*', 'tests/engine-types.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # The module and its tests, typed against the engine types.
  typecheck:
    command: 'tsc -p .'
    inputs: ['hooks/**/*', 'tests/**/*', 'engine-types/**/*', 'tsconfig.json', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # Each hook run by the built binary with fixture inputs and a fixture
  # transcript on a scratch state directory (tests/hooks.sh), then the
  # module's tests, run by the pinned engine (tests/*.test.ts).
  test:
    script: 'bash tests/hooks.sh && ../claude.sh plugin test .'
    inputs: ['**/*', '/plugins/claude.sh', '/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
