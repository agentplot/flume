id = "agentplot.flume"
name = "flume"
version = "0.17.1"
min_herdr_version = "0.9.5"
description = "flume's places in flight in a popup that reads flume's status when it opens and after each key that acts, whose keys act through flume's commands; the sidebar's rows are the clues flume's settles show. It keeps no process and runs no settle: its startup writes what herdr's configuration lacks for it, and exits."
platforms = ["linux", "macos"]

# Once per server, and gone: what herdr's configuration lacks for the
# popup's key and the sidebar's rows, written for flume's status (122,
# C.5).
[[startup]]
command = ["sh", "bin/startup.sh"]

# herdr 0.9.5's action declares no key: the description names the
# host's entry that binds one (122, C.5).
[[actions]]
id = "places"
title = "flume: the places in flight"
description = "flume's places in flight; bind it with a [[keys.command]] entry of type plugin_action and command agentplot.flume.places in herdr's config.toml"
contexts = ["global", "pane"]
command = ["sh", "bin/open.sh", "places"]

[[panes]]
id = "places"
title = "flume"
placement = "popup"
width = "80%"
height = "70%"
command = ["sh", "bin/places.sh"]
