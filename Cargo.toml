# flume's crates: the seams, the core over them, the fakes, the
# conformance suite and the binary. Each is a moon project of its own
# (core.21), and a profile's crate is added to `members` by the unit that
# writes it.
[workspace]
resolver = "2"
members = [
  "crates/flume-seams",
  "crates/flume-fakes",
  "crates/flume-conformance",
  "crates/flume-core",
  "crates/flume",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The kind format, read by weir's crate at a revision of weir's main, moved
# by a chore when weir changes (core.4, core.22).
weir-kinds = { git = "https://github.com/agentplot/weir", rev = "379d68e13705f8f808af9df7fdec8a83a6fb5581" }
toml = "1"
clap = { version = "4", features = ["derive"] }
