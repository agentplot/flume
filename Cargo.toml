# flume's crates: the seams, the core over them, the fakes, the
# conformance suite and the binary. Each is a moon project of its own
# (core.21), and a profile's crate is added to `members` by the unit that
# writes it.
[workspace]
resolver = "2"
members = [
  "crates/flume-seams",
  "crates/flume-fakes",
  "crates/flume-conformance",
  "crates/flume-core",
  "crates/flume",
]

[workspace.package]
# 0.0.0 on main. A release's version is written here, into Cargo.lock and
# into each plugin's manifest in the release commit its tag names
# (set-version.sh, .github/workflows/ci.yml); root:versions holds them
# equal.
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The kind format, read by weir's crate at a revision of weir's main, moved
# by a chore when weir changes (core.4, core.22).
weir-kinds = { git = "https://github.com/agentplot/weir", rev = "0b6eb5abb806a51fec128b01f97c4dcff6170219" }
toml = "1"
clap = { version = "4", features = ["derive"] }
# The digest of a prompt an agent acks received, and of the plugin a
# binary writes (design 14).
sha2 = "0.10"
# The digests of a start's record, keyed by the start's secret (design 7
# of record 0020's change).
hmac = "0.12"
# The host's process table, read for a command's start (design 11).
libc = "0.2"
# The zone a usage limit's reset is named in, and the dates read in it
# (design 6 of record 0020's change).
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false }
