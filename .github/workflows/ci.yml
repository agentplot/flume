name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: ls ~/.rustup/toolchains; cat ~/.rustup/settings.toml; rustup --version; which -a rustup
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - run: devenv shell -- true || true
      - run: |
          ls ~/.rustup/toolchains
          for t in ~/.rustup/toolchains/*; do echo "== $t"; ls "$t/bin" "$t/lib"; cat "$t/lib/rustlib/components"; done
          ls -la .git/proto/tools/rust 2>/dev/null || ls -la "$(git rev-parse --git-common-dir)/proto/tools" || true
        if: always()
